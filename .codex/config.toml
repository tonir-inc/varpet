# Project Codex config. Loads only once this folder is trusted in ~/.codex/config.toml.
# Kept small on purpose: every global MCP server costs start-up time and context in every thread,
# and one thread per job multiplies that. Servers this project does not use are switched off here.

# The team's specs live in Notion. Once per person: `codex mcp login notion`, and pick the TEAM workspace.
[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

# The designer's tools (packages/designer). Started from the repository root of whichever checkout or
# worktree the session runs in; tsx is called directly so nothing but MCP messages reaches stdout.
# Per-laptop settings (for example VARPET_CATALOG_URL for an SSH tunnel to the catalog) go in
# ~/.config/varpet/env, which is read first when it exists.
[mcp_servers.varpet-designer]
command = "sh"
args = ["-c", "[ -f \"$HOME/.config/varpet/env\" ] && . \"$HOME/.config/varpet/env\"; cd \"$(git rev-parse --show-toplevel)\" && export VARPET_SCENE=\"${VARPET_SCENE:-$PWD/packages/designer/test/fixtures/bedroom.json}\" && exec packages/designer/node_modules/.bin/tsx packages/designer/src/server.ts"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 30

# Headless Blender for the compiler lane (the add-on must be running in Blender for the tools to work).
[mcp_servers.blender]
command = "uvx"
args = ["mcp-for-blender"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 30

# Plugins that bring their own servers (Telegram; Datadog's shows up as "mcp").
[plugins."telegram@claude-plugins-official"]
enabled = false
[plugins."datadog@claude-plugins-official"]
enabled = false
