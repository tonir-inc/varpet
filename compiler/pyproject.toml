[project]
name = "varpet-compiler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "scipy>=1.17.1",
    "trimesh>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
partc = "partdsl.compile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partdsl"]
