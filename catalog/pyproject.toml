[project]
name = "varpet-catalog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

# Linux (the VM) gets CPU-only torch; the default Linux wheel pulls ~3 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
