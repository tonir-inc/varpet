[project]
name = "varpet-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai-codex>=0.157.1",
    "pillow>=12.3.0",
    "pydantic>=2.13",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
trace = ["langfuse>=3"]

[project.scripts]
varpet-harness = "varpet_harness.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
