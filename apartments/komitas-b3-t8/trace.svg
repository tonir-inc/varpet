  <!-- The plan draws two flat TVs on wall brackets, one each side of the living/bedroom partition, and no TV unit -->
  <!-- The plan draws both TVs flat on the partition (wall brackets) and no TV unit. The editor cannot wall-mount a TV, so
       the living-room TV stands on a TV unit (2-5's media center). The bedroom TV is left out: a unit there leaves no way past
       the foot of the bed (0.16 m). The bedroom bed is the 2.03 m teak bed, as long as the plan draws it. -->
  <polygon id="tv-unit-living" class="furniture" data-kind="cabinet" data-name="TV unit" data-front="left" data-asset="abo:B07ML7P93X" points="752,667 772,667 772,737 752,737"/>
  <polygon id="tv-living" class="furniture" data-kind="tv" data-name="TV" data-front="left" data-on="tv-unit-living" data-asset="extra:electronics:tv-55-wall-black" points="765,667 772,667 772,737 765,737"/>
  <polygon id="dining-table" class="furniture" data-kind="table" data-name="Dining table" data-front="down" data-asset="abo:B075YPTG8S" points="610,815 707,815 707,861 610,861"/>
  <polygon id="dining-chair-n1" class="furniture" data-kind="chair" data-name="Dining chair" data-front="down" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="618,803 642,803 642,827 618,827"/>
  <polygon id="dining-chair-n2" class="furniture" data-kind="chair" data-name="Dining chair" data-front="down" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="647,803 671,803 671,827 647,827"/>
  <polygon id="dining-chair-n3" class="furniture" data-kind="chair" data-name="Dining chair" data-front="down" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="676,803 700,803 700,827 676,827"/>
  <polygon id="dining-chair-s1" class="furniture" data-kind="chair" data-name="Dining chair" data-front="up" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="618,848 642,848 642,872 618,872"/>
  <polygon id="dining-chair-s2" class="furniture" data-kind="chair" data-name="Dining chair" data-front="up" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="647,848 671,848 671,872 647,872"/>
  <polygon id="dining-chair-w" class="furniture" data-kind="chair" data-name="Dining chair" data-front="right" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="599,825 623,825 623,849 599,849"/>
  <polygon id="dining-chair-e" class="furniture" data-kind="chair" data-name="Dining chair" data-front="left" data-asset="extra:bpy-dining:mcm-walnut-dining-chair-cognac-leather" points="696,825 720,825 720,849 696,849"/>
