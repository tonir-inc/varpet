  <!-- The shallow two-door cupboard between the hall stub and the bathroom wall: the niche is 1.007 m and no closed
       wardrobe model is narrower than 1.0 m, so the 1.0 m two-door wardrobe is fitted to 0.99 m (data-fit) to stand in it -->
  <polygon id="cupboard-hall" class="furniture" data-kind="cabinet" data-name="Hall wardrobe" data-front="down" data-asset="abo:B07RMYWFHY" data-fit="width" points="798.5,421 854.5,421 854.5,445 798.5,445"/>
