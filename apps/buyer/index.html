<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your flat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wdth,wght@62.5..100,300..800&family=Noto+Sans:wdth,wght@62.5..100,300..800&display=swap" rel="stylesheet">
</head>
<body data-mode="designer" data-phase="idle">
  <div class="sheet">
    <main class="stage" id="stage" aria-label="Your flat">
      <div class="viewport" id="viewport"></div>
      <svg class="marks" id="marks" aria-hidden="true"></svg>

      <div class="modes" role="group" aria-label="How you want to work">
        <button data-mode="designer" aria-pressed="true">Designer</button>
        <button data-mode="hand" aria-pressed="false">By hand</button>
      </div>

      <figure class="reference for-designer" id="reference" hidden>
        <div class="ref-pic" id="ref-pic"></div>
        <figcaption>Your picture. Read once, then deleted.</figcaption>
      </figure>
      <p class="replay-tag" id="replay-tag" hidden>Replay of a recorded run</p>

      <div class="dock for-designer">
        <div class="says" id="says" aria-live="polite"></div>
        <div class="decide" id="decide" hidden>
          <button class="primary" id="apply">Apply these changes</button>
          <button id="dismiss">Not now</button>
        </div>
        <form class="composer" id="composer">
          <label class="ibtn" title="Add a picture of a room you like">
            <input type="file" accept="image/png,image/jpeg,image/webp" id="picture-input" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
            <span class="sr">Add a picture of a room you like</span>
          </label>
          <input id="request" autocomplete="off" aria-label="Message the designer" placeholder="Ask for a change">
          <button class="ibtn go" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </form>
      </div>

      <div class="views for-hand" role="group" aria-label="View">
        <button data-view="perspective" aria-pressed="false">3D</button>
        <button data-view="top" aria-pressed="true">Plan</button>
        <button data-view="inside" aria-pressed="false">Walk</button>
      </div>
      <div class="tools for-hand" role="toolbar" aria-label="Edit by hand">
        <button data-tool="select" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z"/></svg>Select</button>
        <button data-tool="move" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>Move</button>
        <button data-tool="rotate" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"/></svg>Rotate</button>
        <span class="sep"></span>
        <button data-act="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg>Undo</button>
      </div>

      <aside class="quote" id="quote" aria-label="What it costs, and who makes it" hidden></aside>
      <div class="drop" id="drop" hidden><p>Drop the picture anywhere</p></div>
    </main>

    <aside class="panel" id="panel"></aside>
    <section class="title" id="title" aria-label="Flat details and total"></section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
