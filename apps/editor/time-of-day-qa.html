<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Time of day verification</title>
<link rel="stylesheet" href="/src/ui/style.css">
<style>body{margin:0}#qa-host{position:absolute;inset:0}#view{position:absolute;inset:62px 0 0}.qa-toolbar{position:absolute;inset:0 0 auto;z-index:10;min-height:62px;padding:10px 14px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line)}.qa-toolbar strong{margin-right:auto}.qa-toolbar .button{white-space:nowrap}#checks{position:absolute;right:14px;bottom:14px;z-index:10;max-width:min(620px,50vw);max-height:38vh;overflow:auto;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}#results{white-space:pre-wrap;font:11px/1.5 monospace;margin-top:8px}#status{font-size:12px}.qa-toolbar #sun{margin-right:8px}@media(max-width:800px){.qa-toolbar{flex-wrap:wrap}.qa-toolbar strong{display:none}#view{top:104px}#checks{max-width:90vw}}</style>
</head><body><main id="qa-host"><div class="qa-toolbar"><strong>Time of day · isolated room</strong><button id="run" class="button">Run day/night checks</button><button id="day" class="button">Noon</button><button id="night" class="button">Night</button><button id="top" class="button">Top</button><button id="perspective" class="button">3D</button><button id="inside" class="button">Inside</button><button id="sun" class="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sun-controls">Sun & time</button></div><div id="view"></div><details id="checks"><summary id="status" role="status">Ready · no saved apartment is loaded</summary><pre id="results"></pre></details></main><script type="module" src="/src/render/time-of-day-qa.ts"></script></body></html>
