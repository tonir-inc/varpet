<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Designer event replay</title></head><body>
<script type="module">
import '/src/ui/style.css';
import '/src/ui/designer-panel.css';
import { mountDesignerPanel } from '/src/ui/designer-panel.ts';
import { parseDesignerEvent } from '/src/adapters/designer-events.ts';
import { demoScene, localCatalog } from '/src/core/demo.ts';
document.body.style.cssText='display:flex;height:100vh;margin:0';
const host=document.createElement('aside'),stage=document.createElement('main');
host.style.cssText='min-width:0;max-width:100vw';
stage.style.cssText='flex:1;display:grid;place-items:center;padding:16px;color:var(--muted)';
stage.textContent='Recorded event replay · no model request';stage.hidden=innerWidth<600;
if(stage.hidden)stage.style.display='none';document.body.append(host,stage);
let callbacks,finish;
const panel=mountDesignerPanel(host,{live:true,snapshot:()=>({scene:demoScene,revision:0,catalog:localCatalog}),
 storage:{getItem:()=>null,setItem(){},removeItem(){}},onProposal(){},
 ask:(_request,options)=>{callbacks=options;return new Promise(resolve=>{finish=resolve;});}});
window.qa={
 start:()=>{void panel.controller.send('Find a cabinet that fits the living room.');},
 legacy:()=>callbacks.onProgress('Waiting for the designer…'),
 event:event=>callbacks.onEvent(parseDesignerEvent(event)),
 end:()=>finish({type:'message',conversationId:'replay',message:'Your cabinet is ready to preview. Nothing changes until you apply a proposal.'}),
 state:()=>panel.controller.state,
};
</script></body></html>
