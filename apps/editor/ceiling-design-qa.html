<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ceiling camera diagnostics</title>
<style>
body{margin:0;background:#141920;color:#eee;font:13px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{padding:8px;color:inherit;background:#323b48;border:1px solid #59616d;border-radius:4px}main{display:grid;grid-template-columns:minmax(400px,1fr) 440px;height:calc(100vh - 100px)}#view{position:relative;min-width:0;height:100%;overflow:hidden}pre{margin:0;padding:12px;background:#1c222b;overflow:auto;white-space:pre-wrap;font:11px/1.4 ui-monospace,monospace}#status{padding:0 12px 10px;min-height:18px;color:#e8c78f}#frame-output{padding:12px}#rendered-frame{display:block;max-width:min(900px,100%);height:auto}#capture-info{color:#e8c78f}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#view{height:60vh}pre{height:40vh}}
</style></head><body><header><strong>Ceiling diagnostics · actual renderer</strong><select id="room" aria-label="Room"></select><button id="quiet">Quiet</button><button id="soft-glow">Glow</button><button id="architectural">Architectural</button><button id="inspect">Inspect ceiling</button><button id="day">Day</button><button id="evening">Evening</button><button id="overview">Overview</button><button id="refresh">Read diagnostics</button><button id="capture">Capture frame</button></header><div id="status">Loading isolated scene. Nothing is saved.</div><main><div id="view"></div><pre id="result">Waiting for a rendered camera.</pre></main><section id="frame-output"><strong>Final compositor output</strong><p id="capture-info">Waiting for a frame capture.</p><img id="rendered-frame" alt="Captured final 3D compositor frame"></section><script type="module" src="/src/render/ceiling-design-qa.ts"></script></body></html>
