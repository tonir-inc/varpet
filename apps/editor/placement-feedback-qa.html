<!doctype html><html><head><title>Placement feedback verification</title><style>body{margin:0;background:#171d25;color:#eee;font:14px system-ui}header{padding:12px}button{padding:8px;margin:3px}#view{position:absolute;inset:110px 0 0}#result{margin:6px}</style></head><body><header><strong>Placement feedback verification — isolated demo</strong><br><button id="wall">Wall conflict</button><button id="floor">Outside floor</button><button id="overlap">Furniture overlap</button><button id="clear">Clear placement</button><button id="door">Clear doorway</button><button id="cancel">Cancel drag</button><button id="release">Release drag</button><button id="top">Top view</button><button id="perspective">3D view</button><button id="undo">Undo</button><div id="result" role="status">Loading</div></header><div id="view"></div><script type="module">
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { createViewport } from '/src/render/viewport.ts';
import { demoScene, localCatalog } from '/src/core/demo.ts';
import { EditorStore } from '/src/core/store.ts';
let controls, dragging=false;
const setMode=TransformControls.prototype.setMode;
TransformControls.prototype.setMode=function(...args){controls=this;return setMode.apply(this,args)};
const store=new EditorStore(demoScene,localCatalog), result=document.querySelector('#result');
const show=(message)=>{result.textContent=`${message} · Revision ${store.revision} · Saved coffee table ${JSON.stringify(store.scene.objects.find(o=>o.id==='coffee-table').position)}`};
const viewport=createViewport(document.querySelector('#view'),{
 onSelect(id){viewport.setSelection(id)}, onInteraction(active){dragging=active}, onError(message){show(message)},
 onTransform(id,patch){const change=store.execute({id:crypto.randomUUID(),label:'QA drag',source:'human',baseRevision:store.revision,operations:[{type:'update',id,patch}]},true);viewport.setScene(store.scene,localCatalog);show(change.ok?'Committed':`Rejected: ${change.errors.join(' ')}`)}
});
viewport.setScene(store.scene,localCatalog);viewport.setSelection('coffee-table');viewport.setTool('move');viewport.setView('top');
function preview(position){if(!dragging) controls.dispatchEvent({type:'mouseDown',mode:'translate'});controls.object.position.set(...position);controls.object.updateMatrixWorld(true);controls.dispatchEvent({type:'objectChange'});show('Preview only')}
document.querySelector('#wall').onclick=()=>preview([0.6,0,0]);
document.querySelector('#floor').onclick=()=>preview([-5.2,0,1.48]);
document.querySelector('#overlap').onclick=()=>preview([-3.25,0,2.8]);
document.querySelector('#clear').onclick=()=>preview([-3.25,0,0.5]);
document.querySelector('#door').onclick=()=>preview([0.6,0,-1.55]);
document.querySelector('#cancel').onclick=()=>{viewport.cancelInteraction();show('Canceled')};
document.querySelector('#release').onclick=()=>controls.dispatchEvent({type:'mouseUp',mode:'translate'});
document.querySelector('#top').onclick=()=>{viewport.setView('top');show('Top view')};
document.querySelector('#perspective').onclick=()=>{viewport.setView('perspective');show('3D view')};
document.querySelector('#undo').onclick=()=>{store.undo();viewport.setScene(store.scene,localCatalog);show('Undo')};
show('Ready');
</script></body></html>
