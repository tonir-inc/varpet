<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sun compass verification</title>
<link rel="stylesheet" href="/src/ui/style.css">
<style>body{height:auto;min-height:100vh;overflow:auto;padding:16px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}main{display:flex;gap:20px;flex-wrap:wrap}#qa-host{position:relative;width:390px;max-width:100%;height:520px;background:var(--ground);border:1px solid var(--line)}#qa-host>button{margin:12px 0 0 12px}#results{white-space:pre-wrap;max-width:600px;font:12px/1.6 monospace}#qa-note{margin-bottom:12px;color:var(--muted)}</style>
</head><body><header><strong>Sun compass · isolated controls</strong><button id="run" class="button">Run compass checks</button><span id="status" role="status">Ready</span></header>
<p id="qa-note">A compact 390 × 520 control host. No apartment is loaded or saved. Drag checks are manual.</p>
<main><div id="qa-host"><button id="sun" class="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sun-controls">Sun</button><button id="plan-view" class="button">Plan focus target</button></div><pre id="results"></pre></main>
<script type="module" src="/src/ui/sun-compass-qa.ts"></script></body></html>
