<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inspector options verification</title><body><div style="position:absolute;left:20px;top:20px;width:400px"><h1>Inspector verification</h1><p id="qa-state">Revision 0</p><button id="qa-window">Select window</button><button id="qa-door">Select door</button><button id="qa-room">Select room</button><button id="qa-plant">Select plant</button><button id="qa-undo">Undo</button><button id="qa-redo">Redo</button><p id="qa-notice"></p><button id="qa-checks">Run inspector DOM checks</button><p id="qa-results" role="status"></p><div id="qa-check-container" hidden></div></div><aside class="right-panel" aria-label="Selection properties"><div class="inspector-heading">Properties</div><div id="inspector" class="inspector"></div></aside><script type="module">
import './src/ui/style.css';
import {checkInspectorDOM} from './src/ui/inspector-dom-check';
document.querySelector('#qa-checks').onclick=()=>{try{document.querySelector('#qa-results').textContent=checkInspectorDOM(document.querySelector('#qa-check-container'));}catch(error){document.querySelector('#qa-results').textContent='FAIL: '+error.message;}};
import {renderEntityInspector,renderAssetChoices} from './src/ui/inspector';
import {EditorStore} from './src/core/store';
import {demoScene,localCatalog} from './src/core/demo';
const store=new EditorStore(demoScene,localCatalog);let selected='window-west',angle=0;
const config={getScene:()=>store.scene,getCatalog:()=>localCatalog,execute:(operations,label)=>{const result=store.execute({id:crypto.randomUUID(),source:'human',baseRevision:store.revision,label,operations},true);document.querySelector('#qa-notice').textContent=result.ok?label:result.errors.join(' ');return result.ok;},notice:(message)=>document.querySelector('#qa-notice').textContent=message,refresh:render,advanced:()=>{},getDoorAngle:()=>angle,testDoor:(id,next)=>{angle=next;document.querySelector('#qa-notice').textContent=`Preview ${Math.round(next*180/Math.PI)} degrees; revision ${store.revision}`;}};
function render(){document.querySelector('#qa-state').textContent=`Revision ${store.revision}`;if(selected==='living-olive'){renderAssetChoices(document.querySelector('#inspector'),store.scene.objects.find(o=>o.id===selected),config);}else renderEntityInspector(document.querySelector('#inspector'),selected,config);}
for(const [key,id]of [['window','window-west'],['door','door-entry'],['room','room-living'],['plant','living-olive']])document.querySelector('#qa-'+key).onclick=()=>{selected=id;render();};
document.querySelector('#qa-undo').onclick=()=>store.undo();document.querySelector('#qa-redo').onclick=()=>store.redo();store.subscribe(render);render();
</script></body></html>
